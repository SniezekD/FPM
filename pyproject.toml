[tool.poetry]
name = "fpm"
version = "0.1.0"
description = "Toolchain for simulating fluid flow through porous media."
authors = ["Damian Śnieżek"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.0.0"
matplotlib = "^3.9.1"
pandas = "^2.2.2"
pyvista = "^0.44.0"
scipy = "^1.14.0"
h5py = "^3.11.0"
jinja2 = "^3.1.4"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
pytest = "^9.1.1"
ipython = "^9.15.0"
codespell = "^2.4.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
